trigger:
  none

pool:
  name: Abhishek
  demands:
    - agent.name -equals Agent1


stages:
  - stage: compile
    displayName: 'Maven Compile'
    jobs:
      - job: maven_compile
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'compile'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              mavenVersionOption: 'Default'
              mavenAuthenticateFeed: false
              effectivePomSkip: false
              sonarQubeRunAnalysis: false

  - stage: test
    displayName: 'Maven Test'
    jobs:
      - job: maven_test
        displayName: 'Unit_Test'
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'test'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              mavenVersionOption: 'Default'
              mavenAuthenticateFeed: false
              effectivePomSkip: false
              sonarQubeRunAnalysis: false

  - stage: trivy_fs_scan
    displayName: 'Trivy FS Scan'
    jobs: 
      - job: trivy_fs_scan
        displayName: 'trivy FS Scan'
        steps:
          - task: CmdLine@2
            inputs:
              script: 'trivy fs --format table -o fs.html .'
  - stage: Build
    displayName: 'Maven Build'
    jobs:
      - job: maven_test
        displayName: 'Build'
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: 'pom.xml'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              mavenVersionOption: 'Default'
              mavenAuthenticateFeed: false
              effectivePomSkip: false
              sonarQubeRunAnalysis: false
  
  - stage: docker_build
    displayName: 'Docker_Build'
    jobs:
      - job: docker_build
        displayName: 'Docker_Build'
        steps:
          - task: CmdLine@2
            inputs:
              script: 'mvn package'
          - task: Docker@2
            inputs:
              containerRegistry: 'docker-svc'
              repository: 'galaxy789/bankapp'
              command: 'buildAndPush'
              Dockerfile: '**/Dockerfile'
              tags: 'latest'
  - stage: trivy_image_scan
    displayName: 'Trivy_Image_Scan'
    jobs: 
      - job: trivy_image_scan
        displayName: 'Trivy_Image_Scan'
        steps:
          - task: CmdLine@2
            inputs:
              script: 'trivy image --format table -o image.html galaxy789/bankapp'
  
  - stage: kubernetes_deployment
    displayName: 'Deploy To AkS'
    jobs:
      - job: deploy_to_aks
        displayName: 'Deploy_To_AKS'
        steps:
          - task: KubernetesManifest@1
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: 'k8s-connection'
              namespace: 'default'
              manifests: 'ds.yaml'
